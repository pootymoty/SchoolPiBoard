# Сборка сервера ключей на стороне GitHub.
#
# Сервер, на котором сервис будет работать, слабый, и ставить на него SDK
# ради сборки не нужно. Здесь собирается готовый архив, который на сервере
# останется только распаковать.
name: license-server

on:
  workflow_dispatch:
  push:
    paths:
      - 'offline/server/**'
      - '.github/workflows/license-server.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: schoolpiboard_licenses
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 3s --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish
        run: >
          dotnet publish offline/server/SchoolPiBoard.LicenseServer/SchoolPiBoard.LicenseServer.csproj
          -c Release -o publish

      - name: Test payment callbacks
        env:
          ASPNETCORE_ENVIRONMENT: Development
          ASPNETCORE_URLS: http://127.0.0.1:5017
          Robokassa__MerchantLogin: test
          Robokassa__Password1: test-form
          Robokassa__Password2: test-result
          Smtp__Host: ''
          Smtp__FromEmail: ''
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: schoolpiboard_licenses
        run: |
          (cd publish && exec dotnet SchoolPiBoard.LicenseServer.dll) >/tmp/license-regression.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" || true' EXIT
          python3 offline/server/tests/payments.py

      - name: Pack
        run: tar -czf license-server.tar.gz -C publish .

      # Готовый архив кладём в релиз: по такой ссылке его можно забрать
      # обычным curl, без токенов и без установки чего-либо на сервер.
      # Только с основной ветки. Иначе сборка из любой ветки заменяла бы
      # боевой архив в релизе license-server-latest — и на сервер уехало бы
      # непроверенное.
      - name: Publish release
        if: github.ref_name == github.event.repository.default_branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete license-server-latest --yes --cleanup-tag || true
          gh release create license-server-latest license-server.tar.gz \
            --title "Сервер ключей — последняя сборка" \
            --notes "Собрано из ${{ github.sha }}. Распаковывается в /var/www/schoolpiboardoff/api." \
            --prerelease
