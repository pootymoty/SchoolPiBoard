# Сборка сервиса тарифов основного сайта на стороне GitHub — тот же
# приём, что и у license-server.yml: сервер слабый, SDK на нём не
# ставится, распаковывается уже готовый архив.
name: tariffs-server

on:
  workflow_dispatch:
  push:
    paths:
      - 'main-site/server/**'
      - '.github/workflows/tariffs-server.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 3s --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish
        run: >
          dotnet publish main-site/server/SchoolPi.Tariffs/SchoolPi.Tariffs.csproj
          -c Release -o publish

      - name: Test renewal schedule
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: postgres
          ConnectionStrings__Postgres: Host=localhost;Database=postgres;Username=postgres;Password=postgres
          TARIFFS_API_KEY: test-api
          LicenseServer__Url: http://127.0.0.1:5018
          LicenseServer__SharedSecret: test-service
        run: python3 main-site/server/tests/renewal_schedule.py

      - name: Pack
        run: tar -czf tariffs-server.tar.gz -C publish .

      # Только с основной ветки — иначе сборка из любой ветки заменяла бы
      # боевой архив в релизе tariffs-server-latest.
      - name: Publish release
        if: github.ref_name == github.event.repository.default_branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete tariffs-server-latest --yes --cleanup-tag || true
          gh release create tariffs-server-latest tariffs-server.tar.gz \
            --title "Сервис тарифов основного сайта — последняя сборка" \
            --notes "Собрано из ${{ github.sha }}. Распаковывается в /var/www/schoolpitariffs/api."
