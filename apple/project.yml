# Проект Xcode описан текстом и генерируется XcodeGen:
#   brew install xcodegen && cd apple && xcodegen generate
# Сам .xcodeproj в репозиторий не кладётся — он собирается из этого файла.
name: DoskaPi
options:
  bundleIdPrefix: online.school-pi
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  DoskaPiCore:
    path: Packages/DoskaPiCore

targets:
  DoskaPi:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: App
    dependencies:
      - package: DoskaPiCore
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Доска Пи
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UISupportsDocumentBrowser: false
        LSSupportsOpeningDocumentsInPlace: true
        UIFileSharingEnabled: true
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: online.school-pi.doskapi
        # Только iPad (2). iPhone не поддерживаем.
        TARGETED_DEVICE_FAMILY: "2"
        # Mac — то же приложение через Mac Catalyst, с тем же идентификатором:
        # так одна покупка в App Store действует и на iPad, и на Mac.
        SUPPORTS_MACCATALYST: YES
        DERIVE_MACCATALYST_PRODUCT_BUNDLE_IDENTIFIER: NO
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
        # Team ID из Apple Developer подставляется при подписи; в CI сборка без подписи.
        DEVELOPMENT_TEAM: ""
        ENABLE_PREVIEWS: YES
    scheme:
      testTargets: []
